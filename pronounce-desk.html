  <script>
    (function () {
      var form = document.getElementById("pronounceForm");
      var input = document.getElementById("masterSearch");
      var hint = document.getElementById("pronounceHint");

      function triggerQuadSearch() {
        var word = input.value.trim();
        hint.textContent = "";

        if (!word) {
          hint.textContent = "請先輸入你想搜尋的關鍵字。";
          input.focus();
          return;
        }

        document.getElementById("frameGoogle").src =
          "https://translate.google.com/?sl=en&tl=zh-TW&text=" + encodeURIComponent(word) + "&op=translate";
        document.getElementById("frameCambridge").src =
          "https://dictionary.cambridge.org/dictionary/english/" + encodeURIComponent(word);
        document.getElementById("frameMerriam").src =
          "https://www.merriam-webster.com/dictionary/" + encodeURIComponent(word);
        document.getElementById("frameOxford").src =
          "https://www.oxfordlearnersdictionaries.com/definition/english/" + encodeURIComponent(word);

        hint.textContent = "已同步搜尋「" + word + "」。若某格空白，可能是該站禁止內嵌顯示。";
      }

      form.addEventListener("submit", function (e) {
        e.preventDefault();
        triggerQuadSearch();
      });
    })();
  </script>
